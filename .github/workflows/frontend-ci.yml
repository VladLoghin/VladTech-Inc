# Frontend CI Pipeline
# Comprehensive CI workflow that includes:
# 1. Build/Compilation (vite build)
# 2. ESLint Linting
# 3. Prettier Code Formatting Check
# 4. Playwright E2E Tests

name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'vladtech-frontend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'vladtech-frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: vladtech-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vladtech-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Step 1: Build/Compilation
      - name: Build
        run: npm run build

      # Step 2: ESLint Linting
      - name: Lint
        run: npm run lint

      # Step 3: Prettier Format Check
      - name: Check formatting with Prettier
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css,json}"

      # Step 4: Playwright E2E Tests
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: vladtech-frontend/playwright-report/
          retention-days: 30
