server:
  port: ${PORT:8080}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}
          audience: ${AUTH0_AUDIENCE}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/vladtechdb}
      database: vladtechdb
      auto-index-creation: true

  mongodb:
    embedded:
      version: 7.0.7

  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
#  mail: #REAL CONFIG (USE THIS OR ANOTHER SIMILAR SETUP ON DEPLOY!!!!)
#    host: mail.smtp2go.com
#    port: 587
#    username:
#    password:
#    properties:
#      mail:
#        smtp:
#          auth: true
#          starttls:
#            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

email:
  noreply: noreply@email.com
  admin: admin@email.com

file:
  upload-dir: ${IMAGES:./uploads}

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.7

auth0:
  domain: ${AUTH0_DOMAIN}

  mgmt:
    clientId: ${AUTH0_MGMT_CLIENT_ID}
    clientSecret: ${AUTH0_MGMT_CLIENT_SECRET}
    audience: ${AUTH0_MGMT_AUDIENCE}

  roles:
    client: ${AUTH0_ROLE_CLIENT}
    employee: ${AUTH0_ROLE_EMPLOYEE}
    admin: ${AUTH0_ROLE_ADMIN}

  default:
    client:
      roleId: ${AUTH0_ROLE_DEFAULT}

renovation:
  rates:
    labor: 50.00
    overhead: 0.15
    contingency: 0.10
    tax: 0.13

