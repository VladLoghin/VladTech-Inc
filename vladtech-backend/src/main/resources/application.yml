spring:
  config:
    activate:
      on-profile: prod

  autoconfigure:
    exclude:
        - de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration

  mongodb:
    embedded:
      enabled: false

  data:
    mongodb:
        uri: ${SPRING_DATA_MONGODB_URI}
       #database: vladtechdb
        auto-index-creation: true

  mail:
    host: mail.smtp2go.com
    port: 587
    username: ${SMTP2GO_USERNAME}
    password: ${SMTP2GO_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

