spring:
  config:
    activate:
      on-profile: docker

  autoconfigure:
    exclude:
      - de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration

  mongodb:
    embedded:
      enabled: false

  data:
    mongodb:
      uri: mongodb://mongo:27017/vladtechdb
      database: vladtechdb
      auto-index-creation: true

  mail:
    host: mailhog
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  mvc:
    static-path-pattern: /uploads/**

  web:
    resources:
      static-locations: file:/uploads/


